plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.jepongdevxyz.devxyztext'
    compileSdk 33

    defaultConfig {
        applicationId "com.jepongdevxyz.devxyztext"
        minSdk 24
        targetSdk 33
        versionCode 2
        versionName "1.1.0"
    }

    // Release signing with Jepong's own key. The keystore itself is never in
    // the repo: CI decodes it from the KEYSTORE_BASE64 secret into the path in
    // KEYSTORE_FILE and passes the passwords via env. When the file is absent
    // (no secrets set yet), the release build stays unsigned instead of
    // failing, and the debug build is unaffected.
    signingConfigs {
        release {
            def ksFile = System.getenv("KEYSTORE_FILE")
            if (ksFile && file(ksFile).exists()) {
                storeFile file(ksFile)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            def ksFile = System.getenv("KEYSTORE_FILE")
            if (ksFile && file(ksFile).exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
